[project]
name = "workbench-enclosure-v3"
version = "0.1.0"
description = "Evidence-based enclosure assembly and supplier specification workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery==2.8.0",
  "scipy==1.18.1",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "reportlab==5.0.1",
  "ezdxf==1.4.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff>=0.16.7", "pypdf>=6.18.1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/enclosure"]
